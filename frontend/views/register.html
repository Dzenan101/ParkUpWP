<form id="register-form" class="mt-3">
  <div class="mb-3">
    <label for="register-full-name" class="form-label">Full Name</label>
    <input
      type="text"
      class="form-control"
      id="register-full-name"
      name="full_name"
      required
    />
  </div>

  <div class="mb-3">
    <label for="register-email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="register-email"
      name="email"
      required
    />
  </div>

  <div class="mb-3">
    <label for="register-password" class="form-label">Password</label>
    <input
      type="password"
      class="form-control"
      id="register-password"
      name="password"
      required
    />
  </div>

  <div class="mb-3">
    <label for="register-role" class="form-label">Role</label>
    <select id="register-role" class="form-select" name="role">
      <option value="user" selected>User</option>
      <option value="admin">Admin</option>
    </select>
  </div>

  <div class="mb-3">
    <label for="register-phone" class="form-label">Phone</label>
    <input
      type="text"
      class="form-control"
      id="register-phone"
      name="phone"
    />
  </div>

  <button type="submit" class="btn btn-success w-100">Register</button>

  <div id="register-error" class="mt-2 text-danger"></div>
</form>
